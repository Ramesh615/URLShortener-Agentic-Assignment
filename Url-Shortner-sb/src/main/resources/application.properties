spring.application.name=url-shortener-agentic
server.port=${SERVER_PORT:9090}

# Configure local Docker MySQL by default. Override through environment variables.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/shortifydb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:shortifyuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:shortifypassword}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Set a unique Base64-encoded secret (at least 256 bits) through JWT_SECRET.
jwt.secret=${JWT_SECRET:VGVzdC1vbmx5LXNlY3JldC1rZXktMzItYnl0ZXMtbG9jYWwtZGV2ZWxvcG1lbnQ=}
jwt.expiration=${JWT_EXPIRATION_MS:172800000}

frontend.url=${FRONTEND_URL:http://localhost:5173}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
